name: Progression integrity
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  integrity:
    name: Progression integrity
    if: github.repository_id == '1428030862'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/mentor-membership-token
        id: members
        with:
          app-id: ${{ vars.MFCP_APP_ID }}
          private-key: ${{ secrets.MFCP_APP_PRIVATE_KEY }}
      - run: node scripts/progression.mjs --verify-pr "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          MFCP_MEMBERS_TOKEN: ${{ steps.members.outputs.token }}
          MFCP_APP_SLUG: ${{ vars.MFCP_APP_SLUG }}
