name: Repository checks
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    if: github.repository_id == '1428030862'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Read proposed merge as data
        if: github.event_name == 'pull_request_target'
        id: input
        run: node scripts/read-pr-input.mjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate proposed files with trusted code
        run: node scripts/check.mjs "$SOURCE_DIRECTORY"
        env:
          SOURCE_DIRECTORY: ${{ steps.input.outputs.directory || '.' }}
      - name: Build directory with trusted code
        run: node scripts/build-pages.mjs "$SOURCE_DIRECTORY"
        env:
          SOURCE_DIRECTORY: ${{ steps.input.outputs.directory || '.' }}
