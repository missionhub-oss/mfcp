name: Registration
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  issues: read
env:
  MFCP_APP_SLUG: ${{ vars.MFCP_APP_SLUG }}
jobs:
  json:
    name: JSON format and fields
    if: github.repository_id == '1428030862'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Validate participant JSON files
        run: node scripts/membership.mjs registration-json
        env:
          GITHUB_TOKEN: ${{ github.token }}
  validate:
    needs: json
    if: github.repository_id == '1428030862'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/mentor-membership-token
        id: members
        with:
          app-id: ${{ vars.MFCP_APP_ID }}
          private-key: ${{ secrets.MFCP_APP_PRIVATE_KEY }}
      - name: Verify GitHub ID, username and PR author
        run: node scripts/membership.mjs registration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MFCP_MEMBERS_TOKEN: ${{ steps.members.outputs.token }}
