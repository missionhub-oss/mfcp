name: Contributor progression
on:
  issue_comment:
    types: [created]
  issues:
    types: [closed, reopened]
  pull_request_target:
    types: [closed]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mfcp-progression-writer
  cancel-in-progress: false
jobs:
  progress:
    if: >-
      github.repository_id == '1428030862' && vars.MFCP_APP_ID != '' &&
      (github.event_name != 'issue_comment' ||
       (!github.event.issue.pull_request && github.event.comment.user.type == 'User'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.MFCP_APP_ID }}
          private-key: ${{ secrets.MFCP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
      - name: Set application commit identity
        run: |
          BOT_LOGIN="${MFCP_APP_SLUG}[bot]"
          BOT_ID=$(gh api "users/$BOT_LOGIN" --jq .id)
          git config user.name "$BOT_LOGIN"
          git config user.email "${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MFCP_APP_SLUG: ${{ vars.MFCP_APP_SLUG }}
      - run: node scripts/progression.mjs --write
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          MFCP_APP_SLUG: ${{ vars.MFCP_APP_SLUG }}
