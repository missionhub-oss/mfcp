name: Contributor notifications
on:
  issues:
    types: [closed]
  push:
    branches: [main]
    paths:
      - 'participants/*.json'
      - 'scripts/notify.mjs'
      - 'scripts/lib/notifications.mjs'
      - '.github/workflows/notifications.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mfcp-contributor-notifications
  cancel-in-progress: false
jobs:
  notify:
    if: github.repository_id == '1428030862' && vars.MFCP_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Notify contributors about recorded achievements
        run: node scripts/notify.mjs --write
        env:
          MFCP_APP_ID: ${{ vars.MFCP_APP_ID }}
          MFCP_BOT_ID: ${{ vars.MFCP_BOT_ID }}
          MFCP_APP_SLUG: ${{ vars.MFCP_APP_SLUG }}
          MFCP_APP_PRIVATE_KEY: ${{ secrets.MFCP_APP_PRIVATE_KEY }}
